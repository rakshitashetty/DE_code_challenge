[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    .mypy_cache

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_third_party =
    pandas
    numpy

[tool:pytest]
addopts = -ra -q
testpaths = tests

[coverage:run]
branch = True
source =
    source_code

[coverage:report]
show_missing = True
skip_covered = True

[black]
line-length = 88
target-version = ['py38']
skip-string-normalization = false
exclude =
    /(
        \.git
        | \.venv
        | build
        | dist
        | __pycache__
    )/
