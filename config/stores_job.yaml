file_type: stores
file_path: ./data/raw/stores.csv
output_path: ./output/clean_stores
schema:
    store_id: string
    store_name: string
    location: string
null_check:
    columns: "all"  # or use "all" to apply to all columns
    null_path: ./output/nulls/sales_null
dup_check:
    columns: "store_id" # or use "all"
    dup_path: ./output/dups/sales_dup
